[project]
name = "vendebot"
version = "0.1.0"
description = "Asistente de pedidos para una tienda online: consulta de catalogo, propuesta de pedido confirmada por el cliente y clasificacion de sentimiento de resenas"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "google-genai>=1.0",
    "langfuse>=3.0",
    "google-cloud-firestore>=2.19",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "deepeval>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vendebot"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
